<!doctype html><meta charset=utf-8><style>html,body{margin:0;background:#0b0b0c}canvas{display:block}</style><script src="data.js"></script>
<canvas id=c width=2560 height=1440 style="width:1280px;height:720px"></canvas><script>
const g=document.getElementById('c').getContext('2d');g.scale(2,2);g.fillStyle='#0a0a0c';g.fillRect(0,0,1280,720);
const stage=+new URLSearchParams(location.search).get('s');
const d=L.dec[2];const raw=[];for(let i=0;i<d.length;i+=2)raw.push([d[i],d[i+1]]);
const win=raw.slice(150,214);let mn=1,mx=0;win.forEach(p=>{mn=Math.min(mn,p[1]);mx=Math.max(mx,p[1])});const x0=win[0][0],x1=win[win.length-1][0];
const P=win.map(p=>[60+(p[0]-x0)/(x1-x0)*1160,530-(p[1]-mn)/(mx-mn)*250]);
const HW=19;const A=[],B=[];P.forEach((p,i)=>{const a=P[Math.max(i-1,0)],b=P[Math.min(i+1,P.length-1)];let dx=b[0]-a[0],dy=b[1]-a[1],h=Math.hypot(dx,dy)||1;A.push([p[0]-dy/h*HW,p[1]+dx/h*HW]);B.push([p[0]+dy/h*HW,p[1]-dx/h*HW]);});
if(stage>=4){for(let i=0;i<P.length-1;i++){for(const t of [[A[i],B[i],A[i+1]],[B[i],A[i+1],B[i+1]]]){g.beginPath();g.moveTo(...t[0]);g.lineTo(...t[1]);g.lineTo(...t[2]);g.closePath();g.fillStyle='rgba(79,195,247,.20)';g.fill();g.strokeStyle='rgba(150,225,255,.95)';g.lineWidth=1.3;g.stroke();}}}
g.lineJoin='round';g.lineCap='round';g.strokeStyle=stage>=4?'rgba(255,255,255,.55)':'#fff';g.lineWidth=stage>=4?1.6:3.4;g.shadowColor='#4fc3f7';g.shadowBlur=stage>=4?0:16;g.beginPath();P.forEach((p,i)=>{i?g.lineTo(...p):g.moveTo(...p)});g.stroke();g.shadowBlur=0;
if(stage>=2){for(const p of P){g.fillStyle='#fff';g.beginPath();g.arc(p[0],p[1],5.2,0,7);g.fill();}}
if(stage>=3){g.shadowColor='#ff5c28';g.shadowBlur=10;for(const p of [...A,...B]){g.fillStyle='#ff6a36';g.beginPath();g.arc(p[0],p[1],5,0,7);g.fill();}g.shadowBlur=0;}
document.title='done';
</script>
