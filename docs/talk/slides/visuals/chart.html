<!doctype html><meta charset=utf-8><style>html,body{margin:0;background:#0b0b0c}canvas{display:block}</style><script src="data.js"></script>
<canvas id=c width=2560 height=1440 style="width:1280px;height:720px"></canvas><script>
const g=document.getElementById('c').getContext('2d');g.scale(2,2);const COL=['#4fc3f7','#9b6bff','#3ddc97','#ffb547'];
const dec=new URLSearchParams(location.search).get('m')==='dec';
g.fillStyle='#0b0d14';g.fillRect(0,0,1280,720);g.strokeStyle='rgba(255,255,255,.06)';g.lineWidth=1;for(let i=1;i<6;i++){g.beginPath();g.moveTo(i*1280/6,0);g.lineTo(i*1280/6,720);g.stroke();g.beginPath();g.moveTo(0,i*120);g.lineTo(1280,i*120);g.stroke();}
const Y=(l,v)=>40+l*26+(1-v)*250;g.lineJoin='round';
L.lines.forEach((s,l)=>{g.strokeStyle=COL[l%4];g.lineWidth=1.3;g.shadowColor=COL[l%4];g.shadowBlur=4;g.beginPath();
 if(dec){const d=L.dec[l];for(let i=0;i<d.length;i+=2){const x=d[i]/316*1280,y=Y(l,d[i+1]);i?g.lineTo(x,y):g.moveTo(x,y);}}
 else{for(let k=0;k<s.length;k++){const x=k/s.length*1280,y=Y(l,s[k]);k?g.lineTo(x,y):g.moveTo(x,y);}}g.stroke();});
document.title='done';
</script>
